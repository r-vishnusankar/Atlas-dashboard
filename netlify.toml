[build]
  publish = "."
  functions = "netlify/functions"

# AI proxy — must come BEFORE the SPA catch-all
[[redirects]]
  from = "/api/ai/health"
  to = "/.netlify/functions/ai-health"
  status = 200

[[redirects]]
  from = "/api/ai/insights"
  to = "/.netlify/functions/ai-insights"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
